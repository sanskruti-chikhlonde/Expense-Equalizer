<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Equalizer | Split Expenses Easily</title>
    
</head>
<body>
    <header>
        <h1>EXPENSE EQUALIZER</h1>
        <p>Calculate • Split • Share</p>
    </header>

    <main>
        <section class="expense details">
           <h2>Expense Details</h2>
           <form>

              <leble for="billAmount">Total Bill Amount</leble>
              <input type="number" id="billAmount" placeholder="Enter Total Bill Amount:">

              <leble for="people">Number of people</leble>
              <input type="number" id="people" placeholder="Enter Number Of People:">

              <leble for="tip">Tip Percentage</leble>
              <input type="number" id="tip" placeholder="Enter Tip Percentage">

              <button type="button">Calculate</button>

           </form>
        </section>

        <!--result-section-->

        <section class="result">
            <h2>Result</h2>

            <p>Total Bill: </p>
            <p>Tip Amount: </p>
            <p>Final Bill: </p>
            <p>Each Person Pays: </p>

        </section>
    </main>

    <footer>
        <p> Designed & Developed by Sanskruti • © 2026 EXPENSE EQUALIZER  </p>
    </footer>
</body>
</html>
